<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mario Leiva Torres · Portfolio</title>
    <meta name="description" content="Personal portfolio of Mario Leiva Torres, Full Stack Developer, designed as an interactive macOS-style desktop." />
    <meta name="author" content="Mario Leiva Torres" />
    <meta name="theme-color" content="#d9c5a7" />

    <!-- Tema antes de pintar, para no ver un destello claro en modo oscuro (ver src/theme/ThemeProvider.jsx) -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Vista previa al compartir el enlace -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mario23leiva.github.io/ReactPortfolio/" />
    <meta property="og:title" content="Mario Leiva Torres · Portfolio" />
    <meta property="og:description" content="Personal portfolio designed as an interactive macOS-style desktop." />

  </head>
